{% extends 'base.html' %}

{% block title %}Parcel registered · Parcelly{% endblock %}

{% block content %}
  <section class="card tracking-card" style="text-align: center">
    <div class="empty-icon">✓</div>
    <p class="eyebrow">Shipment created</p>
    <h1>Parcel is ready to track</h1>
    <p class="subheading">Share this tracking ID with the recipient.</p>

    <div class="meta-box section-gap">
      <span class="meta-label">Tracking ID</span>
      <strong style="font: 800 25px Manrope; color: var(--blue)">
        {{ parcel.tracking_id }}
      </strong>
    </div>

    <div class="action-row" style="justify-content: center">
      <a class="button" href="{% url 'public_parcel_track' %}?tracking_id={{ parcel.tracking_id }}">
        View tracking
      </a>
      <a class="button button-secondary" href="{% url 'admin_parcel_create' %}">
        Register another
      </a>
    </div>
  </section>
{% endblock %}
