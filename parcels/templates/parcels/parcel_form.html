{% extends 'base.html' %}

{% block title %}Register parcel · Parcelly{% endblock %}

{% block content %}
  <section class="form-card card">
    <p class="eyebrow">New shipment</p>
    <h1>Register a parcel</h1>
    <p class="subheading">
      Add shipment details and connect it to a customer and delivery agent.
    </p>

    <form method="post" class="section-gap">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="action-row">
        <button type="submit">Create parcel</button>
        <a class="button button-secondary" href="{% url 'admin_parcels' %}">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
