{% extends 'base.html' %}

{% block title %}Get support · Parcelly{% endblock %}

{% block content %}
  <section class="form-card card">
    <p class="eyebrow">Customer support</p>
    <h1>Tell us what happened</h1>
    <p class="subheading">
      Share your tracking ID and our team will follow up.
    </p>

    <form method="post" class="section-gap">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="action-row">
        <button type="submit">Submit complaint</button>
        <a class="button button-secondary" href="{% url 'customer_complaints' %}">
          My cases
        </a>
      </div>
    </form>
  </section>
{% endblock %}
